<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoBurrow — Go для автоматизации тестирования</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1416;
    --bg-soil-top:#3A2F22;
    --bg-soil-bottom:#0B0F10;
    --panel:#171D20;
    --panel-2:#1D2528;
    --border:#2A3338;
    --border-soft:#232B2E;
    --text:#E9EDEA;
    --text-muted:#8CA0A0;
    --text-dim:#5E7071;
    --accent:#28C4B8;
    --accent-dim:#1B4E4C;
    --amber:#F2B155;
    --success:#5CD68C;
    --success-dim:#1E3D2C;
    --error:#F27B6B;
    --error-dim:#43241F;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim); color:var(--text);}

  a{color:var(--accent);}

  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:100vh;
  }

  /* ===== Burrow rail ===== */
  .rail{
    position:relative;
    background:linear-gradient(180deg, var(--bg-soil-top) 0%, #211A13 18%, #17130F 38%, #100E0D 60%, var(--bg-soil-bottom) 100%);
    border-right:1px solid #000;
    padding:22px 0 40px;
    overflow-y:auto;
  }
  .rail-brand{
    padding:0 20px 18px;
    border-bottom:1px dashed rgba(255,255,255,0.08);
    margin-bottom:6px;
  }
  .rail-brand .mark{
    font-family:var(--mono);
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.02em;
    color:#F5EFE3;
  }
  .rail-brand .mark span{color:var(--accent);}
  .rail-brand .sub{
    font-size:11.5px;
    color:#B7A88E;
    margin-top:4px;
    letter-spacing:.02em;
  }
  .rail-progress{
    margin:14px 20px 8px;
    font-family:var(--mono);
    font-size:11px;
    color:#B7A88E;
    display:flex;
    justify-content:space-between;
  }
  .rail-progress-bar{
    height:4px;
    margin:0 20px 18px;
    background:rgba(255,255,255,0.08);
    border-radius:4px;
    overflow:hidden;
  }
  .rail-progress-bar > i{
    display:block; height:100%;
    background:linear-gradient(90deg, var(--accent), var(--amber));
    width:0%;
    transition:width .4s ease;
  }

  .tunnel{
    position:relative;
    margin-left:34px;
    padding-left:22px;
    border-left:2px dotted rgba(255,255,255,0.14);
  }
  .node{
    position:relative;
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:#CBB99A;
    font-family:var(--sans);
    cursor:pointer;
    padding:11px 12px 11px 16px;
    margin-bottom:2px;
    border-radius:0 8px 8px 0;
    transition:background .15s ease, color .15s ease;
  }
  .node:hover{background:rgba(255,255,255,0.05); color:#F1E7D2;}
  .node.active{
    background:linear-gradient(90deg, rgba(40,196,184,0.18), rgba(40,196,184,0.02));
    color:#fff;
  }
  .node .dot{
    position:absolute; left:-29px; top:16px;
    width:11px; height:11px; border-radius:50%;
    background:#0B0F10;
    border:2px solid rgba(255,255,255,0.25);
  }
  .node.done .dot{ background:var(--success); border-color:var(--success);}
  .node.active .dot{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px rgba(40,196,184,0.2);}
  .node .depth{
    font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    color:#8C7A5C; display:block; margin-bottom:2px; text-transform:uppercase;
  }
  .node.active .depth{ color:var(--accent);}
  .node .ttl{ font-size:13.2px; font-weight:600; display:block;}
  .node .chk{ float:right; font-size:11px; color:var(--success); }

  /* ===== Main ===== */
  main{
    padding:34px 44px 80px;
    max-width:920px;
  }
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:22px; gap:12px; flex-wrap:wrap;
  }
  .topbar h1{
    font-family:var(--mono); font-size:21px; margin:0; letter-spacing:-0.01em;
  }
  .topbar .depth-tag{
    font-family:var(--mono); font-size:11px; color:var(--amber);
    border:1px solid rgba(242,177,85,0.35); padding:3px 9px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:var(--mono); font-size:13px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--text-muted); margin:0 0 14px; display:flex; align-items:center; gap:8px;
  }
  .card h2 i.bar{width:14px; height:2px; background:var(--accent); display:inline-block;}
  .theory p{ margin:0 0 12px; font-size:14.5px; color:#CFD8D6;}
  .theory ul{ margin:0 0 12px; padding-left:20px; font-size:14.5px; color:#CFD8D6;}
  .theory li{margin-bottom:5px;}
  .theory code.inline{
    font-family:var(--mono); background:#0F1516; border:1px solid var(--border-soft);
    padding:1px 5px; border-radius:4px; font-size:12.5px; color:var(--amber);
  }
  table.cmp{ width:100%; border-collapse:collapse; margin:0 0 14px; font-size:13px;}
  table.cmp th, table.cmp td{ border:1px solid var(--border-soft); padding:7px 10px; text-align:left; color:#CFD8D6;}
  table.cmp th{ color:var(--text-muted); font-family:var(--mono); font-size:11.5px; text-transform:uppercase;}

  pre.code{
    background:#0B1011;
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:14px 16px;
    overflow-x:auto;
    font-family:var(--mono);
    font-size:12.6px;
    line-height:1.6;
    color:#D9E4E2;
    margin:0 0 12px;
  }
  pre.code .kw{color:#7FCFEA;}
  pre.code .str{color:#F2B155;}
  pre.code .cmt{color:#5E7071;}

  .task-card{
    border:1px solid var(--border);
    background:var(--panel-2);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:16px;
  }
  .task-card .task-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .task-card .task-label{
    font-family:var(--mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;
  }
  .task-card .status-pill{
    font-family:var(--mono); font-size:10.5px; padding:2px 8px; border-radius:20px;
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  .status-pill.solved{ color:var(--success); border-color:var(--success-dim); background:var(--success-dim);}
  .task-prompt{ font-size:14.5px; color:#DCE6E4; margin-bottom:14px;}

  textarea.answer{
    width:100%; min-height:130px;
    background:#0B1011; color:#EAF3F1;
    border:1px solid var(--border-soft); border-radius:8px;
    font-family:var(--mono); font-size:13px; padding:12px 14px;
    resize:vertical; outline:none;
  }
  textarea.answer:focus{ border-color:var(--accent);}

  .choice-list{ display:flex; flex-direction:column; gap:8px;}
  .choice-opt{
    display:flex; gap:10px; align-items:flex-start;
    border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px;
    cursor:pointer; background:#12181A; transition:border-color .15s;
  }
  .choice-opt:hover{ border-color:var(--accent-dim);}
  .choice-opt.picked{ border-color:var(--accent);}
  .choice-opt.correct{ border-color:var(--success); background:var(--success-dim);}
  .choice-opt.wrong{ border-color:var(--error); background:var(--error-dim);}
  .choice-opt input{ margin-top:3px;}
  .choice-opt pre{ margin:0; background:transparent; border:none; padding:0; font-size:12.5px; white-space:pre-wrap;}
  .choice-opt span.plain{ font-size:13.5px; color:#DCE6E4; padding-top:1px;}

  .row-actions{ display:flex; gap:10px; align-items:center; margin-top:14px;}
  button.btn{
    font-family:var(--sans); font-weight:600; font-size:13.5px;
    background:var(--accent); color:#052220; border:none;
    padding:9px 18px; border-radius:7px; cursor:pointer;
    transition:transform .1s, opacity .15s;
  }
  button.btn:hover{ opacity:.9;}
  button.btn:active{ transform:scale(.97);}
  button.btn.ghost{
    background:transparent; color:var(--text-muted); border:1px solid var(--border);
  }
  button.btn.ghost:hover{ color:var(--text); border-color:var(--text-dim);}

  .feedback{ margin-top:12px; font-size:13.5px; padding:10px 12px; border-radius:8px; display:none;}
  .feedback.show{ display:block;}
  .feedback.ok{ background:var(--success-dim); color:#B7EFC9; border:1px solid rgba(92,214,140,.35);}
  .feedback.bad{ background:var(--error-dim); color:#F6C4BA; border:1px solid rgba(242,123,107,.35);}

  .checklist{ list-style:none; padding:0; margin:8px 0 0; font-family:var(--mono); font-size:12.3px;}
  .checklist li{ padding:3px 0; color:var(--text-dim);}
  .checklist li.pass{ color:var(--success);}
  .checklist li.fail{ color:var(--error);}

  .nav-footer{
    display:flex; justify-content:space-between; margin-top:28px; gap:10px; flex-wrap:wrap;
  }

  footer.credits{
    margin-top:40px; font-size:11.5px; color:var(--text-dim); font-family:var(--mono);
  }

  @media (max-width:760px){
    .app{grid-template-columns:1fr;}
    .rail{
      position:sticky; top:0; z-index:5;
      padding:14px 0; overflow-x:auto; overflow-y:hidden;
      background:linear-gradient(90deg, var(--bg-soil-top), var(--bg-soil-bottom));
      border-right:none; border-bottom:1px solid #000;
    }
    .rail-brand,.rail-progress,.rail-progress-bar{display:none;}
    .tunnel{
      display:flex; gap:6px; margin-left:14px; padding-left:0; border-left:none; width:max-content;
    }
    .node{ width:auto; white-space:nowrap; padding:8px 12px; border-radius:20px; border:1px solid rgba(255,255,255,0.12);}
    .node .dot{display:none;}
    main{padding:22px 16px 60px;}
  }
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail">
    <div class="rail-brand">
      <div class="mark">Go<span>Burrow</span></div>
      <div class="sub">Go для автоматизации тестирования</div>
    </div>
    <div class="rail-progress"><span>Прогресс</span><span id="progressLabel">0 / 0</span></div>
    <div class="rail-progress-bar"><i id="progressBar"></i></div>
    <div class="tunnel" id="tunnel"></div>
  </nav>

  <main>
    <div class="topbar">
      <h1 id="topicTitle">—</h1>
      <span class="depth-tag" id="depthTag">ЭТАП 1</span>
    </div>

    <section class="card theory">
      <h2><i class="bar"></i>Объяснение темы</h2>
      <div id="theoryBody"></div>
    </section>

    <section id="tasksHost"></section>

    <div class="nav-footer">
      <button class="btn ghost" id="prevBtn">← Предыдущий этап</button>
      <button class="btn ghost" id="resetBtn">Сбросить прогресс</button>
      <button class="btn ghost" id="nextBtn">Следующий этап →</button>
    </div>

    <footer class="credits">GoBurrow · по мотивам плана «Go для автоматизации тестирования» · прогресс сохраняется в браузере</footer>
  </main>
</div>

<script>
/* ============================= HELPERS ============================= */

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function hl(code){
  var lines = esc(code).split('\n');
  var kws = ['func','var','const','if','else','for','range','return','package','import',
    'type','struct','interface','map','chan','go','select','switch','case','default',
    'break','continue','defer','nil','true','false','iota','make','len','cap','append','error'];
  return lines.map(function(line){
    var cmtIdx = line.indexOf('//');
    var head = cmtIdx >= 0 ? line.slice(0,cmtIdx) : line;
    var tail = cmtIdx >= 0 ? '<span class="cmt">//'+line.slice(cmtIdx+2)+'</span>' : '';
    head = head.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
    kws.forEach(function(k){
      var re = new RegExp('\\b'+k+'\\b','g');
      head = head.replace(re, '<span class="kw">'+k+'</span>');
    });
    return head + tail;
  }).join('\n');
}

/* ============================= DATA ============================= */

var TOPICS = [
{
  id:'stage1a', depth:1, title:'Этап 1.1. Синтаксис, типы, срезы, map, структуры',
  theory:
    '<p>Go — статически типизированный компилируемый язык без наследования классов; полиморфизм строится через ' +
    'интерфейсы (разберём в следующей теме). Базовые типы жёстко разделены — неявных преобразований между ними нет.</p>' +
    '<p>Slice (срез) — это «окно» над массивом: указатель, длина и capacity. Понимание этого предотвращает частые ' +
    'баги в тестовых данных: <code class="inline">append</code> может как мутировать исходный массив (если хватает ' +
    'capacity), так и создать новый — это одна из главных ловушек (slice gotchas) наравне с aliasing и append на ' +
    'nil-срезе.</p>' +
    '<p>Map — неупорядоченная хеш-таблица, итерация по ней недетерминирована; если тесту нужен стабильный порядок ' +
    'генерации данных — сортируйте ключи явно.</p>' +
    '<p>Структуры (struct) + встраивание (embedding) — механизм композиции вместо наследования: один struct может ' +
    '«включать» другой как поле без явного имени, и его поля/методы становятся доступны напрямую.</p>' +
    hl('type TestCase struct {\n    Name     string\n    Input    int\n    Expected int\n}\n\nfunc sliceGotcha() {\n    a := []int{1, 2, 3}\n    b := a[:2]        // b делит память с a\n    b = append(b, 99) // перезапишет a[2]!\n    fmt.Println(a)    // [1 2 99]\n}'),
  tasks:[
    {
      type:'write', id:'stage1-1',
      prompt:'Напишите функцию <code class="inline">DedupeInts(nums []int) []int</code>, которая убирает дубликаты, ' +
             'сохраняя порядок первого появления. Используйте <code class="inline">map[int]bool</code>, чтобы ' +
             'отмечать уже увиденные значения, и обходите срез через <code class="inline">range</code>.',
      checks:[
        {label:'сигнатура func DedupeInts(nums []int) []int', re:/func\s+DedupeInts\(nums\s+\[\]int\)\s*\[\]int/},
        {label:'используется map[int]bool для отслеживания увиденных', re:/map\[int\]bool/},
        {label:'обход через range nums', re:/range\s+nums/},
        {label:'построение результата через append', re:/append\(/}
      ],
      hint:'func DedupeInts(nums []int) []int {\n    seen := map[int]bool{}\n    result := []int{}\n    for _, n := range nums {\n        if !seen[n] {\n            seen[n] = true\n            result = append(result, n)\n        }\n    }\n    return result\n}'
    },
    {
      type:'choice', id:'stage1-2',
      prompt:'Дан код:<br><code class="inline">a := []int{1, 2, 3, 4, 5}; b := a[:2]; b = append(b, 99)</code>.<br>' +
             'Что напечатает <code class="inline">fmt.Println(a)</code> после этого?',
      options:[
        '[1 2 3 4 5]',
        '[1 2 99 4 5]',
        '[1 2 99]',
        'panic: index out of range'
      ],
      correct:1,
      explanation:'b := a[:2] делит память с a и имеет запас capacity, поэтому append(b, 99) пишет прямо в исходный массив, перезаписывая a[2]. Это классическая ловушка slice aliasing.'
    },
    {
      type:'write', id:'stage1-3',
      prompt:'Опишите структуру <code class="inline">User</code> со встроенной (embedded) структурой ' +
             '<code class="inline">Address</code>, добавьте json-теги к полям и сериализуйте значение через ' +
             '<code class="inline">json.Marshal</code>.',
      checks:[
        {label:'структура Address объявлена', re:/type\s+Address\s+struct\s*\{/},
        {label:'User встраивает Address (без имени поля)', re:/type\s+User\s+struct\s*\{[^}]*\bAddress\b(?!\s+\w)/},
        {label:'есть json-теги вида `json:"..."`', re:/`json:"[a-zA-Z]+"`/},
        {label:'сериализация через json.Marshal(', re:/json\.Marshal\(/}
      ],
      hint:'type Address struct {\n    City string `json:"city"`\n}\n\ntype User struct {\n    Name    string `json:"name"`\n    Address        // embedding: поля Address доступны напрямую\n}\n\ndata, err := json.Marshal(User{Name: "Аня", Address: Address{City: "Москва"}})'
    }
  ]
},
{
  id:'stage1b', depth:1, title:'Этап 1.2. Интерфейсы и обработка ошибок',
  theory:
    '<p>Интерфейсы в Go неявные (structural typing) — не нужно писать <code class="inline">implements</code>. Именно ' +
    'на этом строится тестируемость: любой тип, реализующий методы интерфейса, может подменить реальную зависимость ' +
    'в тесте — это ручной прообраз мокирования (позже это будет автоматически генерировать GoMock).</p>' +
    '<p>Ошибка — обычное значение (<code class="inline">error</code> — интерфейс с методом ' +
    '<code class="inline">Error() string</code>), а не исключение. Для проверки типов и обёрнутых ошибок используют ' +
    '<code class="inline">errors.Is</code> / <code class="inline">errors.As</code> вместе с ' +
    '<code class="inline">fmt.Errorf("...: %w", err)</code>.</p>' +
    '<p><code class="inline">panic/recover</code> — крайний случай, аналог исключений. В тестах иногда нужно перехватить ' +
    'панику через <code class="inline">defer recover()</code>, чтобы проверить защитный код, не роняя весь тестовый ' +
    'прогон.</p>' +
    hl('type Fetcher interface {\n    Fetch(url string) ([]byte, error)\n}\n\ntype mockFetcher struct {\n    data []byte\n    err  error\n}\n\nfunc (m *mockFetcher) Fetch(url string) ([]byte, error) {\n    return m.data, m.err\n}'),
  tasks:[
    {
      type:'write', id:'stage1b-1',
      prompt:'Спроектируйте интерфейс <code class="inline">PaymentGateway</code> с методом ' +
             '<code class="inline">Charge(amountCents int) error</code>, и реализуйте ' +
             '<code class="inline">FakeGateway</code> — управляемую из теста структуру с полем ' +
             '<code class="inline">ShouldFail bool</code>, которая возвращает ошибку, если это поле true.',
      checks:[
        {label:'интерфейс PaymentGateway с методом Charge', re:/type\s+PaymentGateway\s+interface\s*\{[^}]*Charge\(amountCents\s+int\)\s*error/},
        {label:'структура FakeGateway с полем ShouldFail bool', re:/type\s+FakeGateway\s+struct\s*\{[^}]*ShouldFail\s+bool/},
        {label:'метод Charge у FakeGateway', re:/func\s*\([^)]*FakeGateway\)\s*Charge\(amountCents\s+int\)\s*error/},
        {label:'возврат ошибки при ShouldFail', re:/if\s+f\.ShouldFail\s*\{/}
      ],
      hint:'type PaymentGateway interface {\n    Charge(amountCents int) error\n}\n\ntype FakeGateway struct {\n    ShouldFail bool\n}\n\nfunc (f *FakeGateway) Charge(amountCents int) error {\n    if f.ShouldFail {\n        return errors.New("payment declined")\n    }\n    return nil\n}'
    },
    {
      type:'write', id:'stage1b-2',
      prompt:'Напишите функцию <code class="inline">SafeDivide(a, b int) (result int, err error)</code>, которая через ' +
             '<code class="inline">defer</code> и <code class="inline">recover()</code> перехватывает панику деления ' +
             'на 0 и возвращает её как обычную ошибку вместо падения программы.',
      checks:[
        {label:'сигнатура с именованными возвратами (result int, err error)', re:/func\s+SafeDivide\(a,\s*b\s+int\)\s*\(result\s+int,\s*err\s+error\)/},
        {label:'defer func() { ... }() в начале', re:/defer\s+func\(\)\s*\{/},
        {label:'вызов recover()', re:/recover\(\)/},
        {label:'запись в именованный err внутри defer', re:/err\s*=/}
      ],

{
  id:'stage3b', depth:3, title:'Этап 3.x. Ginkgo и Gomega (BDD)',
  theory:
    '<p>Ginkgo даёт структуру спецификаций: <code class="inline">Describe</code> — верхнеуровневый блок про сущность, ' +
    '<code class="inline">Context</code>/<code class="inline">When</code> — условие или сценарий, ' +
    '<code class="inline">It</code> — конкретное утверждение о поведении. Gomega добавляет к этому библиотеку матчеров: ' +
    '<code class="inline">Expect(x).To(Equal(y))</code>, <code class="inline">HaveOccurred()</code>, ' +
    '<code class="inline">ContainSubstring(...)</code> и асинхронные матчеры вроде ' +
    '<code class="inline">Eventually(...)</code>.</p>' +

    'Setup/Teardown из testify.suite.</p>' +
    '<p>У Ginkgo есть собственный CLI: <code class="inline">ginkgo generate</code> создаёт заготовку спеки, ' +
    '<code class="inline">ginkgo -focus="..."</code> запускает только выбранные спецификации, а ' +
    '<code class="inline">ginkgo -p</code> распараллеливает прогон целых пакетов — из коробки, без ручной настройки ' +
    'через <code class="inline">go test</code>. Отчёты JUnit/TeamCity также генерируются «из коробки».</p>' +
    '<table class="cmp"><tr><th>Критерий</th><th>Testify</th><th>Ginkgo+Gomega</th></tr>' +
    '<tr><td>Скорость выполнения</td><td>выше, меньше оверхеда рантайма</td><td>ниже при больших сьютах</td></tr>' +
    '<tr><td>Порог входа</td><td>низкий</td><td>средний, свой DSL</td></tr>' +

    {
      type:'choice', id:'stage7-2',

  ]

      ],
      correct:0,
      explanation:'Это различие определяет, насколько можно доверять инструменту при масштабировании: перебор запасных локаторов ломается при более серьёзных изменениях UI, а понимание намерения теста — более устойчиво.'

      ],

    },
    {

      correct:1,
      explanation:'Онбординг-проверка — прямая метрика поддерживаемости: если добавление одного теста новым человеком занимает больше 10–15 минут, структуру репозитория стоит доработать, независимо от процента покрытия.'

var TOTAL_TASKS = TOPICS.reduce(function(sum,t){ return sum + t.tasks.length; }, 0);

/* ============================= STATE ============================= */
var state = { currentTopic: 0, solved: {} };
var STORAGE_KEY = 'go-burrow-testing-progress';

async function loadProgress(){
  try{
    var res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      var parsed = JSON.parse(res.value);
      state.solved = parsed.solved || {};
      if(typeof parsed.currentTopic === 'number') state.currentTopic = parsed.currentTopic;
    }
  }catch(e){ /* нет сохранённого прогресса — это нормально для первого визита */ }
}
async function saveProgress(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({solved:state.solved, currentTopic:state.currentTopic}), false);
  }catch(e){ console.error('storage error', e); }
}

/* ============================= RENDER ============================= */

function renderRail(){
  var tunnel = document.getElementById('tunnel');
  tunnel.innerHTML = '';
  TOPICS.forEach(function(topic, idx){
    var solvedCount = topic.tasks.filter(function(t){ return state.solved[t.id]; }).length;
    var done = solvedCount === topic.tasks.length;
    var btn = document.createElement('button');
    btn.className = 'node' + (idx === state.currentTopic ? ' active' : '') + (done ? ' done' : '');
    btn.innerHTML =
      '<span class="dot"></span>' +
      '<span class="depth">Этап ' + topic.depth + '</span>' +
      '<span class="ttl">' + topic.title.replace(/^Этап \d+\.\s*/,'') + (done ? ' <span class="chk">✓</span>' : '') + '</span>';
    btn.addEventListener('click', function(){
      state.currentTopic = idx;
      saveProgress();
      renderAll();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tunnel.appendChild(btn);
  });

  var solvedTotal = Object.keys(state.solved).length;
  document.getElementById('progressLabel').textContent = solvedTotal + ' / ' + TOTAL_TASKS;
  document.getElementById('progressBar').style.width = Math.round(100 * solvedTotal / TOTAL_TASKS) + '%';
}

function checkAnswer(topic, task, container){
  var feedback = container.querySelector('.feedback');
  var checklistEl = container.querySelector('.checklist');
  var val = container.querySelector('textarea.answer').value;
  var results = task.checks.map(function(c){ return {label:c.label, pass:c.re.test(val)}; });
  var allPass = results.every(function(r){ return r.pass; });

  checklistEl.innerHTML = results.map(function(r){
    return '<li class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '✓' : '✗') + ' ' + r.label + '</li>';
  }).join('');

  feedback.className = 'feedback show ' + (allPass ? 'ok' : 'bad');
  feedback.textContent = allPass
    ? 'Верно! Все условия задачи выполнены.'
    : 'Пока не всё сходится — сверьтесь со списком требований ниже.';

  if(allPass){
    state.solved[task.id] = true;
    saveProgress();
    renderRail();
    container.querySelector('.status-pill').textContent = 'решено';
    container.querySelector('.status-pill').classList.add('solved');
  }
}

function checkChoice(topic, task, container, pickedIdx){
  var opts = container.querySelectorAll('.choice-opt');
  opts.forEach(function(el, i){
    el.classList.remove('correct','wrong','picked');
    if(i === pickedIdx) el.classList.add('picked');
  });
  var correct = pickedIdx === task.correct;
  opts[task.correct].classList.add('correct');
  if(!correct) opts[pickedIdx].classList.add('wrong');

  var feedback = container.querySelector('.feedback');
  feedback.className = 'feedback show ' + (correct ? 'ok' : 'bad');
  feedback.textContent = (correct ? 'Верно. ' : 'Не совсем. ') + task.explanation;

  if(correct){
    state.solved[task.id] = true;
    saveProgress();
    renderRail();
    container.querySelector('.status-pill').textContent = 'решено';
    container.querySelector('.status-pill').classList.add('solved');
  }
}

function looksLikeCode(s){
  return /[\{\}\(\);]|:=|func\s/.test(s);
}

function renderTaskCard(topic, task, num){
  var wrap = document.createElement('div');
  wrap.className = 'task-card';
  var solved = !!state.solved[task.id];

  wrap.innerHTML =
    '<div class="task-head">' +
      '<span class="task-label">Задача ' + num + '</span>' +
      '<span class="status-pill' + (solved ? ' solved' : '') + '">' + (solved ? 'решено' : 'не решено') + '</span>' +
    '</div>' +
    '<div class="task-prompt">' + task.prompt + '</div>';

  if(task.type === 'write'){
    var ta = document.createElement('textarea');
    ta.className = 'answer';
    ta.placeholder = '// напишите код здесь';
    wrap.appendChild(ta);

    var actions = document.createElement('div');
    actions.className = 'row-actions';
    var checkBtn = document.createElement('button');
    checkBtn.className = 'btn';
    checkBtn.textContent = 'Проверить';
    var hintBtn = document.createElement('button');
    hintBtn.className = 'btn ghost';
    hintBtn.textContent = 'Показать подсказку';
    actions.appendChild(checkBtn);
    actions.appendChild(hintBtn);
    wrap.appendChild(actions);

    var checklist = document.createElement('ul');
    checklist.className = 'checklist';
    wrap.appendChild(checklist);

    var feedback = document.createElement('div');
    feedback.className = 'feedback';
    wrap.appendChild(feedback);

    var hintBox = document.createElement('pre');
    hintBox.className = 'code';
    hintBox.style.display = 'none';
    hintBox.style.marginTop = '10px';
    hintBox.innerHTML = hl(task.hint);
    wrap.appendChild(hintBox);

    checkBtn.addEventListener('click', function(){ checkAnswer(topic, task, wrap); });
    hintBtn.addEventListener('click', function(){
      hintBox.style.display = hintBox.style.display === 'none' ? 'block' : 'none';
    });
  } else if(task.type === 'choice'){
    var list = document.createElement('div');
    list.className = 'choice-list';
    task.options.forEach(function(opt, i){
      var optEl = document.createElement('label');
      optEl.className = 'choice-opt';
      var body = looksLikeCode(opt) ? '<pre>' + hl(opt) + '</pre>' : '<span class="plain">' + esc(opt) + '</span>';
      optEl.innerHTML = '<input type="radio" name="' + task.id + '">' + body;
      optEl.addEventListener('click', function(){
        checkChoice(topic, task, wrap, i);
      });
      list.appendChild(optEl);
    });
    wrap.appendChild(list);

    var feedback2 = document.createElement('div');
    feedback2.className = 'feedback';
    wrap.appendChild(feedback2);
  }

  return wrap;
}

function renderMain(){
  var topic = TOPICS[state.currentTopic];
  document.getElementById('topicTitle').textContent = topic.title;
  document.getElementById('depthTag').textContent = 'ЭТАП ' + topic.depth;
  document.getElementById('theoryBody').innerHTML = topic.theory;

  var host = document.getElementById('tasksHost');
  host.innerHTML = '';
  var card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = '<h2><i class="bar"></i>Практика</h2>';
  topic.tasks.forEach(function(task, i){
    card.appendChild(renderTaskCard(topic, task, i+1));
  });
  host.appendChild(card);

  document.getElementById('prevBtn').disabled = state.currentTopic === 0;
  document.getElementById('prevBtn').style.opacity = state.currentTopic === 0 ? 0.4 : 1;
  document.getElementById('nextBtn').disabled = state.currentTopic === TOPICS.length - 1;
  document.getElementById('nextBtn').style.opacity = state.currentTopic === TOPICS.length - 1 ? 0.4 : 1;
}

function renderAll(){
  renderRail();
  renderMain();
}

document.getElementById('prevBtn').addEventListener('click', function(){
  if(state.currentTopic > 0){
    state.currentTopic--;
    saveProgress();
    renderAll();
    window.scrollTo({top:0, behavior:'smooth'});
  }
});
document.getElementById('nextBtn').addEventListener('click', function(){
  if(state.currentTopic < TOPICS.length - 1){
    state.currentTopic++;
    saveProgress();
    renderAll();
    window.scrollTo({top:0, behavior:'smooth'});
  }
});
document.getElementById('resetBtn').addEventListener('click', function(){
  if(confirm('Сбросить весь прогресс?')){
    state.solved = {};
    saveProgress();
    renderAll();
  }
});

(async function init(){
  await loadProgress();
  renderAll();
})();
</script>
</body>
</html>
